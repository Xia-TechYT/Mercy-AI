plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xiatech.mercyai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xiatech.mercyai'
        minSdk 27
        targetSdk 35
        versionCode 1
        versionName '0.1.0-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
